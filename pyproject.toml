[project]
name = "smart-contract-security-assistant"
version = "0.1.0"
description = "Local-first Solidity security triage assistant with Slither, RAG, MLX-ready generation, and traceable reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.22",
]

[project.optional-dependencies]
audit = [
    "py-solc-x>=2.0",
    "slither-analyzer>=0.10",
]
docs = [
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "pypdf>=4.2",
    "tiktoken>=0.7",
]
rag = [
    "rank-bm25>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
mlx = [
    "mlx>=0.19; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.19; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
web = [
    "gradio>=4.44",
]

[project.scripts]
scsa = "smart_contract_audit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_contract_audit"]
