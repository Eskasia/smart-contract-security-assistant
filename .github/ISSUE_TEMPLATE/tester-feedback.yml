name: External tester feedback
description: Share authorized external tester feedback for SCSA.
title: "[External Tester Feedback]: "
labels:
  - triage
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for repository fixtures or code you own, maintain, or are explicitly authorized to review and discuss. Do not include secrets, private keys, proprietary contracts, customer code, private audit reports, customer data, or unauthorized third-party code.
  - type: input
    id: feedback_issue_or_permission
    attributes:
      label: External public evidence links (optional)
      description: The current GitHub issue is the current feedback record. Add public evidence links outside this issue, or confirm permission to summarize privately shared feedback.
      placeholder: "https://.../issue/123 or permission confirmed"
    validations:
      required: false
  - type: checkboxes
    id: authorization
    attributes:
      label: Authorization confirmation
      options:
        - label: I own, maintain, or am explicitly authorized to test and discuss the repository or fixture described in this issue.
          required: true
        - label: I removed private code, private keys, secrets, addresses, and proprietary audit material from this issue.
          required: true
        - label: I did not run SCSA against unauthorized third-party code or deployed contracts.
          required: true
    validations:
      required: true
  - type: input
    id: tester_github
    attributes:
      label: Tester GitHub handle
      description: Use the GitHub handle for the person who ran the test.
      placeholder: "@octocat"
    validations:
      required: true
  - type: input
    id: repository_tested
    attributes:
      label: Repository tested
      description: Use a public URL, "repository fixture", or a redacted owned/authorized repository description.
      placeholder: "repository fixture: tests/contracts/VulnerableVault.sol"
    validations:
      required: true
  - type: textarea
    id: authorization_basis
    attributes:
      label: Authorization basis
      description: Explain why you were allowed to run the test and share this feedback.
      placeholder: "I maintain this repository / I own this contract / I ran only the bundled fixture."
    validations:
      required: true
  - type: input
    id: install_method
    attributes:
      label: Install method
      description: Describe how you installed or ran SCSA.
      placeholder: "git clone + uv sync --extra audit --dev"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command run
      description: Paste the exact command you ran. Redact private paths if needed.
      placeholder: |
        uv run scsa analyze tests/contracts/VulnerableVault.sol \
          --out-dir reports-tester-fixture \
          --native-build-policy disabled
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - pass
        - fail
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python, Node, solc, and SCSA versions.
      placeholder: |
        OS:
        Python:
        Node:
        solc:
        SCSA version or commit:
    validations:
      required: true
  - type: textarea
    id: report_artifact_summary
    attributes:
      label: Report artifact summary
      description: Summarize generated artifacts without pasting private code, local paths, secrets, or customer data.
      placeholder: |
        Output directory:
        JSON report generated: yes/no
        Markdown report generated: yes/no
        SQLite trace generated: yes/no
        High-level result summary:
    validations:
      required: true
  - type: dropdown
    id: testimonial_evidence
    attributes:
      label: Can this feedback count as testimonial evidence?
      description: Select whether this feedback should be eligible as testimonial evidence.
      options:
        - "no"
        - "yes"
    validations:
      required: true
  - type: textarea
    id: usability_feedback
    attributes:
      label: Usability feedback
      description: Include setup, command, report readability, false-positive, false-negative, and docs feedback.
      placeholder: |
        Install/setup feedback:
        Command clarity:
        Report usefulness 1-5:
        False positives:
        False negatives:
        Documentation gaps:
        Other notes:
    validations:
      required: true
  - type: checkboxes
    id: sensitive_material_confirmation
    attributes:
      label: Sensitive material confirmation
      options:
        - label: I removed private code, secrets, addresses, and proprietary audit material from this issue and shared artifacts.
          required: true
    validations:
      required: true
  - type: dropdown
    id: permission_to_quote
    attributes:
      label: Permission to quote
      description: May maintainers quote your feedback publicly with your GitHub handle?
      options:
        - "no"
        - "yes"
    validations:
      required: true
