name: Publish PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --extra audit --dev
      - run: uv run python scripts/check_release_tag.py "${{ github.event.release.tag_name }}"
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python scripts/sync_report_schema.py --check
      - run: npm ci
        working-directory: frontend
      - run: npm run test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv build
      - run: git diff --check
      - run: uv publish --trusted-publishing always
