name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra audit --dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: RAG recall eval
        run: uv run python eval/run_eval.py
      - name: Judge eval
        run: uv run python eval/run_judge.py
