name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: uv sync --extra audit --dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: RAG recall eval
        run: uv run python eval/run_eval.py
      - name: Judge eval
        run: uv run python eval/run_judge.py
      - name: Public benchmark gate
        run: >
          uv run python eval/run_public_benchmark.py
          --min-supported-hit-rate 0.95
          --min-score-gap 30
          --min-recall 0.5
          --min-f1 0.5
      - name: Public project build preflight
        run: uv run python eval/run_public_project_builds.py --preflight-only
      - name: Frontend test
        working-directory: frontend
        run: npm run test -- --run
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Whitespace check
        run: git diff --check
